<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital viewport</title>
<style>
  :root { --bg: #040a10; --panel: rgba(10, 22, 32, 0.86); --text: #dbe7ee; --muted: #8ea3b0; --accent: #3fd0c9; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The legend is a strip under the canvas, never on top of the drawing. */
  #stage { display: flex; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; }
  #viewport { position: relative; flex: 1; min-height: 0; }
  #viewport canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid rgba(111, 227, 255, 0.18);
           border-radius: 6px; padding: 4px; }
  .tools { top: 10px; display: flex; gap: 4px; }
  #modes { left: 10px; } #zoom { right: 10px; }
  .tools button { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.12);
                  border-radius: 5px; padding: 3px 9px; font: inherit; cursor: pointer; min-width: 28px; }
  .tools button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #032024; }
  .tools button:hover { border-color: var(--accent); }
  .tools button:disabled { opacity: 0.35; cursor: not-allowed; }
  #legend { flex: none; padding: 6px 10px; font-size: 11px; color: var(--text);
            border-top: 1px solid rgba(111, 227, 255, 0.15); background: #071119; max-height: 30vh; overflow: auto; }
  #legend .muted { color: var(--muted); }
  #notice { inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
            background: var(--bg); color: var(--muted); }
  #notice[hidden] { display: none; }
</style>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@__THREE_VERSION__/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@__THREE_VERSION__/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage">
  <div id="viewport">
    <div id="modes" class="panel tools" role="group" aria-label="View">
      <button type="button" data-mode="earth">Earth-centred</button>
      <button type="button" data-mode="sun">Sun-centred</button>
    </div>
    <div id="zoom" class="panel tools" role="group" aria-label="Camera">
      <button type="button" data-zoom="in" title="Zoom in">＋</button>
      <button type="button" data-zoom="out" title="Zoom out">－</button>
      <button type="button" data-zoom="reset" title="Reset view">⟲</button>
    </div>
    <div id="notice" class="panel" hidden></div>
  </div>
  <div id="legend"></div>
</div>
<script type="application/json" id="payload">__PAYLOAD__</script>
<script type="module">
__SCENE_JS__
</script>
</body>
</html>
