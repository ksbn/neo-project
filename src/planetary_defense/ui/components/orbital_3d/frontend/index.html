<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital viewport</title>
<style>
  /* Glass over deep space: matches ui/theme.py (ice-blue accent, hairline borders, pills). */
  :root { --bg: #050912; --panel: rgba(22, 32, 60, 0.42); --line: rgba(255, 255, 255, 0.14);
          --text: #eef3ff; --muted: rgba(226, 234, 255, 0.6); --accent: #8ec5ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 12px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
               -webkit-font-smoothing: antialiased; }
  /* The legend is a strip under the canvas, never on top of the drawing. */
  #stage { display: flex; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; }
  #viewport { position: relative; flex: 1; min-height: 0; }
  #viewport canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
           padding: 4px; -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
           box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 8px 24px rgba(0, 0, 0, 0.35); }
  .tools { top: 10px; display: flex; gap: 4px; }
  #modes { left: 10px; } #zoom { right: 10px; }
  .tools button { background: transparent; color: var(--text); border: 1px solid transparent;
                  border-radius: 999px; padding: 4px 12px; font: inherit; font-weight: 500; cursor: pointer;
                  min-width: 30px; transition: background .2s, border-color .2s; }
  .tools button[aria-pressed="true"] { background: var(--accent); color: #061022;
                                       box-shadow: 0 0 14px rgba(142, 197, 255, 0.45); }
  .tools button:hover { border-color: rgba(142, 197, 255, 0.55); }
  .tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tools button:disabled { opacity: 0.35; cursor: not-allowed; }
  #legend { flex: none; padding: 8px 14px; font-size: 11px; color: var(--text);
            border-top: 1px solid var(--line); background: rgba(10, 16, 34, 0.9); max-height: 30vh; overflow: auto; }
  #legend .muted { color: var(--muted); }
  #notice { inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; border-radius: 0;
            background: var(--bg); color: var(--muted); }
  #notice[hidden] { display: none; }
</style>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@__THREE_VERSION__/build/three.module.min.js",

</head>
<body>
<div id="stage">
  <div id="viewport">
    <div id="modes" class="panel tools" role="group" aria-label="View">
      <button type="button" data-mode="earth">Earth-centred</button>
      <button type="button" data-mode="sun">Sun-centred</button>
    </div>
    <div id="zoom" class="panel tools" role="group" aria-label="Camera">
      <button type="button" data-zoom="in" title="Zoom in">＋</button>
      <button type="button" data-zoom="out" title="Zoom out">－</button>
      <button type="button" data-zoom="reset" title="Reset view">⟲</button>
    </div>
    <div id="notice" class="panel" hidden></div>
  </div>
  <div id="legend"></div>
</div>

</html>
