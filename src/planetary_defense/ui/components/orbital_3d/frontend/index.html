<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital viewport</title>
<style>
  :root { --bg: #05070d; --panel: rgba(12, 17, 28, 0.82); --text: #d7dde8; --muted: #8b95a7; --accent: #6fb3ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The legend is a strip under the canvas, never on top of the drawing. */
  #stage { display: flex; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; }
  #viewport { position: relative; flex: 1; min-height: 0; }
  #viewport canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid rgba(255,255,255,0.08);
           border-radius: 8px; padding: 8px 10px; backdrop-filter: blur(4px); }
  #toolbar { top: 10px; left: 10px; display: flex; gap: 6px; padding: 4px; }
  #toolbar button { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.15);
                    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #toolbar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #04101f; }
  #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #legend { position: static; flex: none; margin: 0 8px 8px; font-size: 11px; max-height: 34vh; overflow: auto; }
  @media (max-width: 620px) { #hint { display: none; } }
  #legend h3 { margin: 0 0 4px; font-size: 13px; }
  #legend p { margin: 2px 0; }
  #legend .muted { color: var(--muted); }
  #legend .swatch { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: middle; }
  #notice { inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
            background: var(--bg); color: var(--muted); }
  #notice[hidden] { display: none; }
  #hint { right: 10px; top: 10px; color: var(--muted); }
</style>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@__THREE_VERSION__/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@__THREE_VERSION__/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage">
  <div id="viewport">
    <div id="toolbar" class="panel" role="group" aria-label="View">
      <button type="button" data-mode="earth">Earth-centred</button>
      <button type="button" data-mode="sun">Sun-centred</button>
    </div>
    <div id="hint" class="panel">Drag to rotate, scroll to zoom</div>
    <div id="notice" class="panel" hidden></div>
  </div>
  <div id="legend" class="panel"></div>
</div>

</html>
