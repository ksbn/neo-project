[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "planetary-defense"
version = "0.1.0"
description = "NASA NeoWs pipeline and Planetary Defense Control Room dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "streamlit>=1.40,<2",
    "pandas>=2.0,<4",
    "fastapi>=0.165,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "responses>=0.25,<1",
    "pyright>=1.1.414,<2",
    "ruff>=0.14,<1",
    # contract tests: openapi.yaml as JSON Schema, and FastAPI's test client
    "jsonschema>=4.26,<5",
    "pyyaml>=6.0,<7",
    "httpx2>=2.16,<3",
]

[project.scripts]
# `neo-pipeline --start 2026-11-01` == `python -m planetary_defense.cli --start 2026-11-01`
neo-pipeline = "planetary_defense.cli:main"
# REST API (openapi.yaml) and the dashboard that consumes it, on http://localhost:8010
neo-api = "planetary_defense.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The 3D viewport's HTML template and scene script ship with the package.
"planetary_defense.ui.components.orbital_3d" = ["frontend/*.html", "frontend/*.js"]
"planetary_defense.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src: the package without needing an install; tests: support.py and fakes.py
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests", "app.py"]
exclude = ["venv", ".venv", "**/__pycache__", "build"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
extraPaths = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import sorting, bugbear, pyupgrade
select = ["F", "E", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["planetary_defense"]
known-local-folder = ["contract", "fakes", "support"]
